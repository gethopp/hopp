[package]
version = "0.1.0"
edition = "2021"
name = "hopp_core_tests"

[dependencies]
livekit = { git = "https://github.com/gethopp/rust-sdks", branch = "hopp", features = ["native-tls"] }
tokio = { version = "1", features = ["full", "parking_lot"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket_lib = { path = "../socket_lib", features = ["test-support"] }
clap = { version = "4.5", features = ["derive"] }
livekit-api = { git = "https://github.com/gethopp/rust-sdks", branch = "hopp" }
rand = "0.8"
arboard = "3.4"
ctrlc = "3.4"
